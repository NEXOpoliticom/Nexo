<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexo Actualidad</title>
<meta name="description" content="Nexo Actualidad: el medio oficial del partido NEXO (Núcleo Español por el Orden).">
<style>
:root{--bg:#ffffff;--card:#fff;--ink:#1f1a1c;--mute:#6a5f63;--brand:#592a3a;--line:#e6dde0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media not all{:root:not([data-theme="light"]){--bg:#171214;--card:#221a1d;--ink:#f1eaec;--mute:#aa9ba1;--brand:#d9a9b8;--line:#38292e}}
:root[data-theme="dark"]{--bg:#171214;--card:#221a1d;--ink:#f1eaec;--mute:#aa9ba1;--brand:#d9a9b8;--line:#38292e}
html{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.top{border-bottom:1px solid var(--line);font:12px system-ui,sans-serif;color:var(--mute);padding:8px 0;display:flex;justify-content:space-between;gap:8px}
.mast{display:flex;align-items:center;justify-content:center;gap:14px;padding:18px 0 12px;border-bottom:3px double #592a3a;cursor:pointer}
.mast img{width:64px;height:64px;border-radius:6px;display:block}
.logo{font:800 34px/1 system-ui,sans-serif;letter-spacing:.14em;color:var(--brand)}
.tag{font:11px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:6px}
nav{display:flex;gap:16px;overflow-x:auto;padding:10px 0;font:600 13px system-ui,sans-serif;border-bottom:1px solid var(--line);white-space:nowrap}
nav a{color:var(--ink);text-decoration:none;cursor:pointer;padding-bottom:2px}
nav a.on{color:var(--brand);border-bottom:2px solid #592a3a}
.kicker{font:700 12px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin:22px 0 6px}
h1{font-size:29px;line-height:1.15;margin:0 0 10px}
.sub{font-size:18px;color:var(--mute);margin:0 0 14px}
.by{font:13px system-ui,sans-serif;color:var(--mute);padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.hero{width:100%;border-radius:6px;display:block}
.cap{font:12px system-ui,sans-serif;color:var(--mute);margin:6px 0 18px}
article p{margin:0 0 16px;font-size:18px;text-align:justify;hyphens:none}
blockquote{margin:22px 0;padding:6px 0 6px 16px;border-left:4px solid #592a3a;font-size:21px;font-style:italic;color:var(--brand)}
blockquote cite{display:block;font:13px system-ui,sans-serif;font-style:normal;color:var(--mute);margin-top:6px}
h2{font:700 13px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin:30px 0 12px;padding-bottom:6px;border-bottom:2px solid #592a3a}
ul{padding-left:20px;margin:0 0 16px}li{font-size:18px;margin-bottom:6px;text-align:justify;hyphens:none}
.grid{display:grid;gap:12px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer}
.card b{font-size:17px;line-height:1.3;display:block;margin:2px 0}
.card small{font:12px system-ui,sans-serif;color:var(--mute)}
.card p{margin:4px 0 0;font-size:15px;color:var(--mute)}
.lead{cursor:pointer}.lead h1{margin-top:4px}
.intro{font-size:18px;color:var(--mute);margin:18px 0 4px}
.adm{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{font:600 13px system-ui,sans-serif;border:1px solid #592a3a;background:#592a3a;color:#fff;border-radius:6px;padding:9px 14px;cursor:pointer}
button.o{background:transparent;color:var(--brand)}
button.d{background:transparent;color:#b3261e;border-color:#b3261e}
form{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin:16px 0;font:14px system-ui,sans-serif}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:15px system-ui,sans-serif;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:220px;font-family:ui-monospace,monospace;font-size:14px}
.help{font-size:12px;color:var(--mute);margin-top:4px}
.team{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:16px 0}.tm img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block}.tm b{display:block;margin-top:6px;font-size:16px}.tm small{font:12px system-ui,sans-serif;color:var(--mute)}.ag{display:grid;gap:10px;margin:16px 0}.ev{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px}.ev.past{opacity:.75}.dt{background:#592a3a;color:#fff;border-radius:6px;min-width:54px;text-align:center;padding:6px 4px}.dt b{display:block;font:800 22px system-ui,sans-serif}.ev>div:last-child b{display:block;font-size:16px;line-height:1.3}.ev small{display:block;font:12px system-ui,sans-serif;color:var(--mute)}.dt small{color:#fff;text-transform:uppercase;font:11px system-ui,sans-serif}.ev a{font:600 12px system-ui,sans-serif;color:var(--brand);cursor:pointer;text-decoration:underline}.msg{font:13px system-ui,sans-serif;color:var(--mute);margin:8px 0}
footer{margin:40px 0 24px;padding-top:14px;border-top:1px solid var(--line);font:12px system-ui,sans-serif;color:var(--mute);text-align:center}
</style>
</head>

ue importa de verdad».\n## Punto de partida: la familia\nLa portavoz sostuvo que hoy es «muy complicado formar una familia» y que los jóvenes necesitan medios y ayudas para tener y criar hijos. «Sin hijos no hay relevo generacional», afirmó. NEXO propone facilitar la conciliación de la vida familiar y laboral para que criar a los hijos no dependa exclusivamente de la situación económica de cada hogar.\n## Las ocho líneas del programa\n- **Familia y conciliación:** apoyo a las familias y a las mujeres para formar un hogar y criar a sus hijos.\n- **Educación y autoridad de los padres:** una enseñanza basada en el esfuerzo, la disciplina y el respeto, con familias informadas y participativas. El partido rechaza cualquier forma de acoso o discriminación y sitúa la protección de los menores por encima de cualquier otra consideración.\n- **Sanidad y pensiones:** reforzar la atención primaria, mejorar la contratación de profesionales, reducir las listas de espera e implantar una **tarjeta sanitaria única nacional**. Defensa de un sistema público de pensiones sólido y sostenible.\n- **Protección y dignidad de la vida:** rechazo de toda forma de violencia y asistencia a las víctimas, especialmente mujeres, menores, mayores y personas dependientes. NEXO defiende la dignidad de la vida desde la concepción hasta su final natural, con acompañamiento a embarazos en circunstancias difíciles y refuerzo de los cuidados paliativos.\n- **Cultura, tradiciones e identidad nacional:** defensa del patrimonio histórico, las festividades populares y la herencia cristiana.\n- **Economía al servicio de las familias:** impulso de la industria nacional y de los sectores estratégicos, defensa de la propiedad privada y la iniciativa empresarial, apoyo a autónomos, pymes y negocios familiares, y menos burocracia.\n- **Vivienda y turismo:** vivienda protegida libre de okupación, nuevas construcciones en zonas de demanda, rehabilitación y recuperación de viviendas vacías, y mecanismos de financiación para quienes no disponen del ahorro inicial. También abordará el impacto de la concentración de alojamientos turísticos para que sea compatible con el derecho de los residentes a mantener sus barrios.\n- **Política migratoria ordenada:** capacidad para gestionar las fronteras, flujos legales, refuerzo de las fuerzas de seguridad contra las mafias y procedimientos de retorno más ágiles para quienes estén de forma ilegal.\n## El salario por trabajo doméstico\nEntre las medidas más destacadas, Rodríguez recordó el **salario por trabajo doméstico**: una prestación mensual de entre 100 y 400 euros, según la dedicación y la situación económica familiar, para reconocer las labores domésticas y de cuidados. Los años dedicados a la crianza y al hogar tendrían además reconocimiento en el sistema público de pensiones. «Cuidar de los hijos, atender a nuestros mayores y mantener un hogar también es contribuir al bienestar de toda España», señaló.\n> Este programa representa nuestro compromiso con España, con las familias y con las próximas generaciones. | Carmen Rodríguez, portavoz de NEXO\n## Turno de preguntas y cierre\nTras la exposición, la portavoz abrió un turno de preguntas para los medios de comunicación. La comparecencia concluyó con la lectura del Salmo 33:12: «Bienaventurada la nación cuyo Dios es el Señor, el pueblo que él escogió como heredad para sí».\n## Dossier y acreditaciones para la prensa\nA su llegada, los periodistas recibieron un dossier de prensa fechado el 13 de noviembre de 2026, una acreditación de «Prensa» con acceso total, y agua embotellada con la imagen corporativa del partido."}, {"id": "n1", "section": "Partido", "date": "2026-10-22", "author": "Redacción Nexo Actualidad", "title": "NEXO se presenta oficialmente y pide «volver a lo que importa»: familia, raíces y responsabilidad", "sub": "El partido conservador Núcleo Español por el Orden presenta a su candidata, Marta García, su programa y su equipo en un acto abierto a los medios.", "image": ar el acceso para que los jóvenes puedan emanciparse y formar sus propios hogares.\n- **Economía:** apoyo a las pequeñas empresas, protección de la producción nacional y defensa de la iniciativa privada.\n- **Ayudas a las familias:** ayudas económicas para que cada familia decida cómo organizar la crianza y el cuidado del hogar, reconociendo el valor de la maternidad y del trabajo doméstico.\n- **Identidad y tradiciones:** defensa de las tradiciones cristianas y de la identidad nacional.\n- **Educación:** un modelo basado en la excelencia, la autoridad y el respeto.\n## Un equipo para llevarlo adelante\nRodríguez presentó al equipo que acompañará a la candidata:\n- **Ángela Fernández**, jefa de campaña.\n- **María Estibaly Pérez**, directora de comunicación.\n- **Ana Revilla y Mireya Rojas**, responsables de investigación e ideología.\n- **Erica Guzmán**, directora de estrategia.\n- **Virginia Tarradas**, creadora de contenido.\n## El cierre: «cenad con los vuestros»\nGarcía cerró el acto con un gesto poco habitual. Frente a quienes terminan pidiendo el voto «a gritos», pidió a los asistentes que esa noche apaguen el teléfono y cenen con los suyos, porque, afirmó, la familia, y no el atril, «es el verdadero centro del mundo».\nLa portavoz dio paso después al turno de preguntas de los medios de comunicación."}, {"id": "n2", "section": "Propuestas", "date": "2026-10-22", "author": "Redacción Nexo Actualidad", "title": "Las propuestas de NEXO: familia, vivienda y tradiciones", "sub": "Un resumen del programa presentado en el acto.", "image": "", "cap": "", "body": "La familia es la prioridad del programa de NEXO. Estas son sus líneas principales:\n- **Vivienda:** acceso para que los jóvenes puedan emanciparse.\n- **Economía:** apoyo a pymes, producción nacional e iniciativa privada.\n- **Familias:** ayudas para decidir cómo organizar la crianza y el cuidado del hogar.\n- **Tradiciones e identidad:** defensa de las tradiciones cristianas y de la identidad nacional.\n- **Educación:** excelencia, autoridad y respeto."}, {"id": "n3", "section": "Equipo", "date": "2026-10-22", "author": "Redacción Nexo Actualidad", "title": "Así es el equipo de NEXO", "sub": "Seis personas, un proyecto.", "image": "", "cap": "", "body": "- **Marta García:** candidata.\n- **Carmen Rodríguez:** portavoz.\n- **Ángela Fernández:** jefa de campaña.\n- **María Estibaly Pérez:** directora de comunicación.\n- **Ana Revilla y Mireya Rojas:** investigación e ideología.\n- **Erica Guzmán:** directora de estrategia.\n- **Virginia Tarradas:** creadora de contenido."}, {"id": "n4", "section": "Partido", "date": "2026-10-22", "author": "Redacción Nexo Actualidad", "title": "Qué significa NEXO: Núcleo, Español, Orden", "sub": "El nombre del partido resume tres ideas.", "image": "", "cap": "", "body": "- **Núcleo:** la familia es la base de la sociedad.\n- **Español:** defensa de la identidad, la cultura y las tradiciones.\n- **Orden:** responsabilidad y una sociedad con principios claros.\nSu lema es **«Volver a lo que importa»**: recuperar aquello que nos une y dar valor a lo esencial."}], "team": [{"name": "Marta García", "role": "Candidata", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAIVAZADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09 const SEC=['Partido','Propuestas','Equipo','Agenda'],$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const fd=d=>new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
function md(t){let o='',u=0;const c=()=>{if(u){o+='</ul>';u=0}};t.split('\n').forEach(l=>{if(l.startsWith('- ')){if(!u){o+='<ul>';u=1}o+='<li>'+inl(l.slice(2))+'</li>';return}c();if(!l.trim())return;if(l.startsWith('## '))o+='<h2>'+esc(l.slice(3))+'</h2>';else if(l.startsWith('> ')){const[q,a]=l.slice(2).split(' | ');o+='<blockquote>'+inl(q)+(a?'<cite>— '+esc(a)+'</cite>':'')+'</blockquote>'}else o+='<p>'+inl(l)+'</p>'});c();return o}
const card=a=>'<div class="card" data-go="a-'+a.id+'"><small>'+esc(a.section.toUpperCase())+' · '+fd(a.date)+'</small><b>'+esc(a.title)+'</b>'+(a.sub?'<p>'+esc(a.sub)+'</p>':'')+'</div>';
function go(v){location.hash=v;view=v;edit=null;render();scrollTo(0,0)}
function agendaHtml(){const td=new Date().toISOString().slice(0,10),M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return '<div class="ag">'+S.agenda.map(e=>{const p=e.date<td;return '<div class="ev'+(p?' past':'')+'"><div class="dt"><b>'+Number(e.date.slice(8))+'</b><small>'+M[+e.date.slice(5,7)-1]+'</small></div><div><b>'+esc(e.title)+'</b><small>'+esc(e.day)+(e.time?' · '+esc(e.time):'')+(p?' · Celebrado':'')+'</small>'+(e.news?'<a data-go="a-'+e.news+'">Leer la noticia</a>':'')+'</div></div>'}).join('')+'</div>'}
function render(){
$('#date').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const isArt=view.startsWith('a-');const art=isArt&&S.articles.find(a=>a.id==view.slice(2));
$('#nav').innerHTML=['Última hora',...SEC].map((s,i)=>'<a data-go="'+(i?s:'')+'" class="'+((i?view==s:view=='')?'on':'')+'">'+s+'</a>').join('');
let h='';const adm=canEdit?'<div class="adm"><button data-new>+ Nueva noticia</button>'+(SEC.includes(view)?'<button class="o" data-intro>Editar texto de la sección</button>':'')+'</div>':'';
if(edit){h=form()}
else if(isArt&&art){h=adm+'<article><div class="kicker">'+esc(art.section)+'</div><h1>'+esc(art.title)+'</h1><p class="sub">'+esc(art.sub)+'</p><div class="by"><b>'+esc(art.author)+'</b> · '+fd(art.date)+'</div>'+(art.image?'<img class="hero" src="'+art.image+'" alt="">'+(art.cap?'<div class="cap">'+esc(art.cap)+'</div>':''):'')+md(art.body)+(art.gallery&&art.gallery.length?'<h2>Galería</h2>'+art.gallery.map(g=>'<img class="hero" src="'+g.src+'" alt=""><div class="cap">'+esc(g.cap||'')+'</div>').join(''):'')+'</article>'+(canEdit?'<div class="adm"><button class="o" data-edit="'+art.id+'">Editar</button><button class="d" data-del="'+art.id+'">Eliminar</button></div>':'')}
else if(SEC.includes(view)){const l=S.articles.filter(a=>a.section==view);h=adm+'<p class="intro">'+esc(S.intro[view]||'')+'</p>'+(view=='Equipo'?'<div class="team">'+S.team.map(p=>'<div class="tm"><img src="'+p.photo+'" alt="'+esc(p.name)+'"><b>'+esc(p.name)+'</b><small>'+esc(p.role)+'</small></div>').join('')+'</div>':'')+(view=='Agenda'?agendaHtml():'')+'<div class="grid">'+(l.map(card).join('')||(view=='Agenda'?'':'<p class="msg">Todavía no hay noticias en esta sección.</p>'))+'</div>'}
else{const[f,...r]=S.articles;h=adm+(f?'<div class="lead" data-go="a-'+f.id+'"><div class="kicker">'+esc(f.section)+'</div><h1>'+esc(f.title)+'</h1><p class="sub">'+esc(f.sub)+'</p><div class="by"><b>'+esc(f.author)+'</b> · '+fd(f.date)+'</div>'+(f.image?'<img class="hero" src="'+f.image+'" alt="">':'')+'</div><h2>Más noticias</h2><div class="grid">'+r.map(card).join('')+'</div>':'<p class="msg">Aún no hay noticias.</p>')}
app.innerHTML=h}
function form(){const a=edit;return '<form id="f"><b>'+(a.isNew?'Nueva noticia':'Editar noticia')+'</b><label>Título</label><input name="title" value="'+esc(a.title)+'"><label>Subtítulo</label><input name="sub" value="'+esc(a.sub)+'"><label>Sección</label><select name="section">'+SEC.map(s=>'<option'+(s==a.section?' selected':'')+'>'+s+'</option>').join('')+'</select><label>Autor</label><input name="author" value="'+esc(a.author)+'"><label>Fecha</label><input type="date" name="date" value="'+a.date+'"><label>Foto (opcional)</label><input type="file" accept="image/*" name="img"><label>Más fotos (opcional)</label><input type="file" accept="image/*" name="gal" multiple><label>Pie de foto</label><input name="cap" value="'+esc(a.cap)+'"><label>Texto</label><textarea name="body">'+esc(a.body)+'</textarea><div class="help">Una línea = un párrafo. «## Título» para un apartado, «- » para lista, «&gt; cita | autor» para una cita y **negrita** entre asteriscos dobles.</div><div class="adm"><button type="button" data-save>Publicar</button><button type="button" class="o" data-cancel>Cancelar</button></div><div class="msg" id="m"></div></form>'}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(f)})}
async function save(){const m=$('#m');if(m)m.textContent='Publicando…';try{const a=await claude.use('artifact');const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');await a.publish('<!DOCTYPE html>\n'+c.outerHTML)}catch(e){if(m)m.textContent='No se pudo publicar: '+(e.code||e.message)}}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-go],[data-new],[data-edit],[data-del],[data-save],[data-cancel],[data-intro],#home');if(!t)return;
if(t.id=='home')return go('');
if(t.dataset.go!==undefined)return go(t.dataset.go);
if(t.hasAttribute('data-new')){edit={isNew:1,title:'',sub:'',section:SEC.includes(view)?view:'Partido',author:'Redacción Nexo Actualidad',date:new Date().toISOString().slice(0,10),cap:'',body:'',image:''};return render()}
if(t.dataset.edit){edit={...S.articles.find(a=>a.id==t.dataset.edit)};return render()}
if(t.hasAttribute('data-cancel')){edit=null;return render()}
if(t.dataset.del){if(confirm('¿Eliminar esta noticia?')){S.articles=S.articles.filter(a=>a.id!=t.dataset.del);view='';await save()}return}
if(t.hasAttribute('data-intro')){const v=prompt('Texto de la sección '+view,S.intro[view]||'');if(v!==null){S.intro[view]=v;await save()}return}
if(t.hasAttribute('data-save')){const f=$('#f'),g=n=>f.elements[n].value;if(!g('title').trim()){$('#m').textContent='Escribe un título.';return}
const o={...edit,title:g('title'),sub:g('sub'),section:g('section'),author:g('author'),date:g('date'),cap:g('cap'),body:g('body')};
const file=f.elements.img.files[0];if(file)o.image=await shrink(file);for(const x of f.elements.gal.files)o.gallery=[...(o.gallery||[]),{src:await shrink(x),cap:''}];
if(o.isNew){delete o.isNew;o.id=Date.now().toString(36);S.articles.unshift(o);view='a-'+o.id}else{S.articles=S.articles.map(a=>a.id==o.id?o:a);view='a-'+o.id}
location.hash=view;await save()}});
view=location.hash.slice(1);render();
(async()=>{try{const u=await claude.use('user');/* edición desactivada */}catch(e){}})();
</script>
</body>
</html>
